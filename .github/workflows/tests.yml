name: Tests

# push is limited to master so that a branch with an open PR does not run the
# whole workflow twice for the same commit.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  #v7.0.0
        with:
          # Matches the Python version the Docker image ships.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r server/requirements.txt

      - name: Run bridge tests
        working-directory: server
        # Binds localhost ports and drives the real bridge against a fake
        # LC7001 and a fake Hubitat. Exits non-zero on any failed check.
        run: python test_bridge.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Build the bridge image
        run: docker build -t legrand_hubitat_bridge server

      # A successful build only proves the Dockerfile parses. Run the image the
      # way the README tells users to -- config volume included -- so that CMD,
      # EXPOSE and the LEGRAND_CONFIG path are actually exercised.
      - name: Smoke-test the image
        run: |
          docker run -d --name bridge -p 21120:21120 \
            -v legrand_config:/data legrand_hubitat_bridge
          for _ in $(seq 30); do
            curl -fsS http://localhost:21120/status -o /tmp/status.json && break
            sleep 1
          done
          docker logs bridge
          cat /tmp/status.json
          grep -q '"initHubConnected": *false' /tmp/status.json
          docker rm -f bridge
